[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remoboard"
version = "1.0.0"
description = "Type into a phone running the Remoboard keyboard from Python — official client for the Remoboard WebSocket protocol."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "everettjf" }]
keywords = ["remoboard", "remote-keyboard", "websocket", "ios", "automation", "input"]
dependencies = ["websockets>=12.0"]

[project.urls]
Homepage = "https://github.com/everettjf/Remoboard"
Repository = "https://github.com/everettjf/Remoboard"

[tool.hatch.build.targets.wheel]
packages = ["remoboard"]
